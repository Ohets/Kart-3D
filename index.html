<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Retro Kart 3D</title>
<style>
*{box-sizing:border-box;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Segoe UI,Tahoma,sans-serif}#canvas3d{display:block;width:100%;height:100%}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000b;z-index:10;padding:20px}.hidden{display:none!important}h1{color:#fc0;text-shadow:3px 3px #f30;text-transform:uppercase;letter-spacing:2px}h2{color:#0ff}.btn{background:linear-gradient(135deg,#fc0,#f90);border:0;border-radius:30px;padding:14px 30px;font-size:1.1rem;font-weight:bold;margin:8px;cursor:pointer}.btn-blue{background:linear-gradient(135deg,#0ff,#09f);color:#fff}.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:600px;width:100%;margin:12px}.level-item{background:#222;border:2px solid #0f0;border-radius:8px;padding:14px 5px;text-align:center;cursor:pointer}.level-item.locked{border-color:#f30;color:#999}.hud{position:absolute;inset:0;z-index:5;padding:15px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.hud-card{background:#000a;border:2px solid #fc0;border-radius:14px;padding:9px 16px;font-weight:bold}.controls{position:absolute;bottom:20px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;padding:0 28px}.control{width:72px;height:72px;border:3px solid #fffa;border-radius:50%;background:#fff3;color:#fff;display:grid;place-items:center;font-size:28px}.group{display:flex;gap:14px}#countdown{position:absolute;top:35%;left:0;right:0;text-align:center;font-size:6rem;color:#fc0;text-shadow:4px 4px #000}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<canvas id="canvas3d"></canvas>
<div id="hud" class="hud hidden"><div class="hud-card">🪙 <span id="credits">100</span></div><div class="hud-card" style="border-color:#0ff">🏁 Mission <span id="level">1</span>/40</div></div>
<div id="countdown" class="hidden"></div>
<div id="controls" class="controls hidden"><div class="group"><div class="control" id="left">◀</div><div class="control" id="right">▶</div></div><div class="control" id="gas">▲</div></div>
<div id="menu" class="overlay"><h1>Retro Kart 3D</h1><h2>Wähle eine Mission</h2><p>Neue kurvige Rennstrecken warten auf dich!</p><div id="levels" class="level-grid"></div></div>
<div id="result" class="overlay hidden"><h1 id="resultTitle">Sieg!</h1><p id="resultText"></p><button id="again" class="btn">Nochmal</button><button id="menuBtn" class="btn btn-blue">Hauptmenü</button></div>
<script>
const state={credits:+localStorage.getItem('mk3d_credits')||100,unlocked:JSON.parse(localStorage.getItem('mk3d_levels')||'[1]'),level:1,playing:false,length:1000};
const keys={left:false,right:false,gas:false};let scene,camera,renderer,player,enemy,segments=[],leftRails=[],rightRails=[];let p={z:0,lane:0,speed:0},e={z:0,lane:2,speed:1.7};
function save(){localStorage.setItem('mk3d_credits',state.credits);localStorage.setItem('mk3d_levels',JSON.stringify(state.unlocked));document.querySelectorAll('#credits').forEach(x=>x.textContent=state.credits)}
function curveAt(z){return Math.sin(z*.010)*6+Math.sin(z*.0047+1.4)*3.5+Math.sin(z*.0018)*2.2}
function curveSlope(z){return .06*Math.cos(z*.010)+.01645*Math.cos(z*.0047+1.4)+.00396*Math.cos(z*.0018)}
function angleAt(z){return Math.atan(curveSlope(z))}
function makeKart(color){let g=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(1.4,.6,2.2),new THREE.MeshPhongMaterial({color}));body.position.y=.4;g.add(body);let wg=new THREE.CylinderGeometry(.3,.3,.4,12),wm=new THREE.MeshPhongMaterial({color:0x111111});[-.8,.8].forEach(x=>[-.8,.8].forEach(z=>{let w=new THREE.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.3,z);g.add(w)}));scene.add(g);return g}
function buildTrack(){segments.forEach(x=>scene.remove(x));leftRails.forEach(x=>scene.remove(x));rightRails.forEach(x=>scene.remove(x));segments=[];leftRails=[];rightRails=[];const width=16,len=20,count=Math.ceil(state.length/len)+8;for(let i=0;i<count;i++){let z=-i*len,ang=angleAt(z),x=curveAt(z),mat=new THREE.MeshPhongMaterial({color:i%2?0x555555:0x444444});let road=new THREE.Mesh(new THREE.PlaneGeometry(width,len+1),mat);road.rotation.x=-Math.PI/2;road.rotation.z=ang;road.position.set(x,0,z);scene.add(road);segments.push(road);let railMat=new THREE.MeshPhongMaterial({color:i%2?0xffffff:0xff2222});[-1,1].forEach(side=>{let r=new THREE.Mesh(new THREE.BoxGeometry(.6,1.2,len+1),railMat);r.position.set(x+side*width/2, .6,z);r.rotation.y=ang;scene.add(r);(side<0?leftRails:rightRails).push(r)})}}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.FogExp2(0x87ceeb,.014);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1000);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('canvas3d'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;scene.add(new THREE.AmbientLight(0xffffff,.65));let sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(10,30,20);scene.add(sun);buildTrack();player=makeKart(0x0099ff);enemy=makeKart(0xff3333);}
function placeKart(kart,z,lane){let x=curveAt(z)+lane,ang=angleAt(z);kart.position.set(x,0,z);kart.rotation.y=ang}
function start(){state.playing=false;state.length=1800 + state.level*120;p={z:0,lane:-2,speed:0};e={z:0,lane:2,speed:1.6+state.level*.02};document.getElementById('level').textContent=state.level;buildTrack();document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');document.getElementById('hud').classList.remove('hidden');document.getElementById('controls').classList.remove('hidden');let cd=3;let cdEl=document.getElementById('countdown');cdEl.classList.remove('hidden');cdEl.textContent=cd;let timer=setInterval(()=>{cd--;cdEl.textContent=cd||'START!';if(cd<0){clearInterval(timer);cdEl.classList.add('hidden');state.playing=true}},1000)}
function finish(){state.playing=false;document.getElementById('hud').classList.add('hidden');document.getElementById('controls').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let won=p.z<e.z;document.getElementById('resultTitle').textContent=won?'🏆 Sieg!':'💥 Verloren!';document.getElementById('resultTitle').style.color=won?'#0f0':'#f30';document.getElementById('resultText').textContent=won?'Mission '+state.level+' geschafft! +50 Credits.':'Der Gegner war schneller. Versuch es erneut!';if(won){state.credits+=50;if(state.level<40&&!state.unlocked.includes(state.level+1))state.unlocked.push(state.level+1)}save();document.getElementById('again').textContent=won?'Nächstes Level':'Nochmal';document.getElementById('again').onclick=()=>{if(won&&state.level<40)state.level++;start()}}
function loop(){requestAnimationFrame(loop);if(state.playing){if(keys.gas)p.speed=Math.min(2.2,p.speed+.05);else p.speed=Math.max(0,p.speed-.03);if(keys.left)p.lane=Math.max(-7.1,p.lane-.15);if(keys.right)p.lane=Math.min(7.1,p.lane+.15);p.z-=p.speed;e.z-=e.speed;e.lane=2+Math.sin(Date.now()/400)*2.5;placeKart(player,p.z,p.lane);placeKart(enemy,e.z,e.lane);let x=curveAt(p.z);camera.position.set(x+p.lane,3.5,p.z+7);camera.lookAt(new THREE.Vector3(x+p.lane,1,p.z-10));if(p.z<=-state.length||e.z<=-state.length)finish()}renderer.render(scene,camera)}
function menuLevels(){let levels=document.getElementById('levels');levels.innerHTML='';for(let i=1;i<=40;i++){let b=document.createElement('div');b.className='level-item '+(state.unlocked.includes(i)?'':'locked');b.textContent=state.unlocked.includes(i)?'Mission '+i:'🔒 '+i;b.onclick=()=>{if(state.unlocked.includes(i)){state.level=i;start()}else if(state.credits>=30&&confirm('Mission '+i+' für 30 Credits freischalten?')){state.credits-=30;state.unlocked.push(i);save();menuLevels()}};levels.appendChild(b)}}
function bind(id,key){let el=document.getElementById(id);['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=true}));['touchend','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false}))}bind('left','left');bind('right','right');bind('gas','gas');addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key==='w')keys.gas=true});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.key==='ArrowUp'||e.key==='w')keys.gas=false});document.getElementById('menuBtn').onclick=()=>{document.getElementById('result').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');menuLevels()};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});init();menuLevels();save();loop();
</script></body></html>
