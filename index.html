<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Retro Kart 3D</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #111; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: white; }
        #canvas3d { display: block; width: 100%; height: 100%; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); }
        .hidden { display: none !important; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; color: #ffcc00; text-shadow: 3px 3px #ff3300; text-transform: uppercase; letter-spacing: 2px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; color: #00ffff; }
        p { font-size: 1rem; margin-bottom: 20px; max-width: 500px; color: #ddd; line-height: 1.5; }

        .btn { background: linear-gradient(135deg, #ffcc00, #ff9900); color: #000; border: none; padding: 15px 35px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 15px rgba(255,153,0,0.4); }
        .btn:active { transform: scale(0.95); box-shadow: 0 2px 5px rgba(255,153,0,0.6); }
        .btn-blue { background: linear-gradient(135deg, #00ffff, #0099ff); color: #fff; box-shadow: 0 5px 15px rgba(0,255,255,0.4); }

        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }
        .hud-top { display: flex; justify-content: space-between; width: 100%; }
        .hud-card { background: rgba(0,0,0,0.6); border: 2px solid #333; padding: 10px 20px; border-radius: 15px; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; pointer-events: none; }
        .hud-yellow { border-color: #ffcc00; color: #ffcc00; }
        .hud-blue { border-color: #00ffff; color: #00ffff; }

        .level-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-height: 50vh; overflow-y: auto; padding: 10px; width: 100%; max-width: 600px; background: rgba(255,255,255,0.06); border: 2px solid rgba(255,255,255,0.15); border-radius: 15px; }
        @media (max-width: 600px) { .level-grid { grid-template-columns: repeat(4, 1fr); } }
        .level-item { background: #222; border: 2px solid #444; border-radius: 10px; padding: 15px 5px; font-weight: bold; cursor: pointer; position: relative; transition: all 0.2s; }
        .level-item.unlocked { border-color: #00ff00; color: #00ff00; }
        .level-item.locked { border-color: #ff3300; color: #999; opacity: 0.7; }
        .level-item.current { background: #ffcc00; color: #000; border-color: #fff; }
        .level-item .lock-cost { font-size: 0.75rem; display: block; color: #ff9900; margin-top: 5px; }

        #controls { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; z-index: 6; }
        .control-btn { width: 75px; height: 75px; background: rgba(255,255,255,0.2); border: 3px solid rgba(255,255,255,0.6); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; }
        .control-btn:active { background: rgba(255,255,255,0.5); }
        .ctrl-group { display: flex; gap: 15px; }

        #countdown { font-size: 6rem; font-weight: bold; color: #ffcc00; text-shadow: 4px 4px #000; display: none; pointer-events: none; }

        .shop-options { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 400px; }
        .shop-item { background: #222; border: 2px solid #555; padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .shop-item:active { background: #333; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <canvas id="canvas3d"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-top">
            <div class="hud-card hud-yellow">🪙 Credits: <span id="hud-credits">100</span></div>
            <div class="hud-card hud-blue">🏁 Mission: <span id="hud-level">1</span>/40</div>
        </div>
        <div class="hud-top" style="justify-content: center; margin-top: 10px;">
            <div id="countdown">3</div>
        </div>
        <div class="hud-top" style="align-items: flex-end; height: 100px;">
            <div class="hud-card" style="color: #fff;">Pos: <span id="hud-pos">2</span>/2</div>
        </div>
    </div>

    <div id="controls" class="hidden">
        <div class="ctrl-group">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="control-btn" id="btn-gas" style="background: rgba(0,255,0,0.2); border-color: rgba(0,255,0,0.6);">▲</div>
        </div>
    </div>

    <div id="menu-screen" class="overlay">
        <h1>Retro Kart 3D</h1>
        <h2>Wähle eine Mission (1-40)</h2>
        <div class="hud-card hud-yellow" style="margin-bottom: 15px; pointer-events:none;">🪙 Deine Credits: <span id="menu-credits">100</span></div>
        <div class="level-grid" id="level-grid"></div>
        <button class="btn btn-blue" id="btn-open-shop">🛒 Credits kaufen</button>
    </div>

    <div id="result-screen" class="overlay hidden">
        <h1 id="result-title">Sieg!</h1>
        <p id="result-desc">Du hast das Ziel als 1. erreicht!</p>
        <div class="hud-card hud-yellow" style="margin-bottom: 20px; pointer-events:none;">🪙 Credits: <span id="result-credits">100</span></div>
        <button class="btn" id="btn-result-action">Nächstes Level</button>
        <button class="btn btn-blue" id="btn-result-menu">Hauptmenü</button>
    </div>

    <div id="shop-screen" class="overlay hidden">
        <h1>Münz-Shop</h1>
        <p>Kaufe Credits, um blockierte Strecken sofort freizuschalten!</p>
        <div class="shop-options">
            <div class="shop-item" onclick="buyCredits(50, 0.99)">
                <span>🪙 50 Credits</span>
                <button class="btn" style="padding:5px 15px; margin:0; font-size:1rem;">0,99 €</button>
            </div>
            <div class="shop-item" onclick="buyCredits(200, 2.99)">
                <span>🪙 200 Credits</span>
                <button class="btn" style="padding:5px 15px; margin:0; font-size:1rem;">2,99 €</button>
            </div>
            <div class="shop-item" onclick="buyCredits(500, 4.99)">
                <span>🪙 500 Credits</span>
                <button class="btn" style="padding:5px 15px; margin:0; font-size:1rem;">4,99 €</button>
            </div>
        </div>
        <button class="btn btn-blue" id="btn-close-shop" style="margin-top:20px;">Zurück</button>
    </div>

    <script>
        const AudioEngine = {
            ctx: null,
            bgmInterval: null,
            engineOsc: null,
            engineGain: null,
            init() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            },
            playBGM() {
                if(!this.ctx) this.init();
                if(this.bgmInterval) return;
                this.bgmInterval = setInterval(() => {
                    if(!gameState.playing) return;
                    let now = this.ctx.currentTime;
                    let note = [110, 130, 146, 165, 110, 130, 196, 220][Math.floor(Date.now() / 250) % 8];
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(note, now);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                }, 250);
            },
            stopBGM() {
                if(this.bgmInterval) clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            },
            playEngine(speedRatio) {
                if(!this.ctx) return;
                if(!this.engineOsc) {
                    this.engineOsc = this.ctx.createOscillator();
                    this.engineGain = this.ctx.createGain();
                    this.engineOsc.type = 'sawtooth';
                    this.engineOsc.frequency.setValueAtTime(60, this.ctx.currentTime);
                    this.engineGain.gain.setValueAtTime(0.02, this.ctx.currentTime);
                    this.engineOsc.connect(this.engineGain);
                    this.engineGain.connect(this.ctx.destination);
                    this.engineOsc.start();
                }
                this.engineOsc.frequency.setValueAtTime(50 + speedRatio * 120, this.ctx.currentTime);
            },
            stopEngine() {
                if(this.engineOsc) {
                    try { this.engineOsc.stop(); } catch(e) {}
                    this.engineOsc = null;
                    this.engineGain = null;
                }
            },
            playWin() {
                if(!this.ctx) return;
                let now = this.ctx.currentTime;
                [261, 329, 392, 523].forEach((f, i) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(f, now + i * 0.1);
                    gain.gain.setValueAtTime(0.2, now + i * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.3);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.1); osc.stop(now + i * 0.1 + 0.3);
                });
            },
            playLoose() {
                if(!this.ctx) return;
                let now = this.ctx.currentTime;
                [392, 349, 311, 246].forEach((f, i) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.frequency.setValueAtTime(f, now + i * 0.15);
                    gain.gain.setValueAtTime(0.2, now + i * 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.15 + 0.4);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(now + i * 0.15); osc.stop(now + i * 0.15 + 0.4);
                });
            },
            playCrash() {
                if(!this.ctx) return;
                let now = this.ctx.currentTime;
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(now); osc.stop(now + 0.2);
            }
        };

        const gameState = {
            credits: parseInt(localStorage.getItem('mk3d_credits')) || 100,
            unlockedLevels: JSON.parse(localStorage.getItem('mk3d_levels')) || [1],
            currentLevel: 1,
            playing: false,
            countdown: 3,
            trackLength: 1000
        };

        function saveData() {
            localStorage.setItem('mk3d_credits', gameState.credits);
            localStorage.setItem('mk3d_levels', JSON.stringify(gameState.unlockedLevels));
            document.getElementById('hud-credits').innerText = gameState.credits;
            document.getElementById('menu-credits').innerText = gameState.credits;
            document.getElementById('result-credits').innerText = gameState.credits;
        }

        let scene, camera, renderer;
        let playerVehicle, enemyVehicle;
        let roadSegments = [];
        let leftBarriers = [], rightBarriers = [];
        let decorations = [];
        let particles = [];

        let keys = { left: false, right: false, gas: false };
        let playerStats = { z: 0, x: 0, speed: 0, maxSpeed: 2.2, accel: 0.05, decel: 0.03 };
        let enemyStats = { z: 0, x: 2, speed: 1.8 };

        function curveAt(z) {
            return Math.sin(z * 0.010) * 6 + Math.sin(z * 0.0047 + 1.4) * 3.5 + Math.sin(z * 0.0018) * 2.2;
        }

        function curveSlope(z) {
            return 0.06 * Math.cos(z * 0.010) + 0.01645 * Math.cos(z * 0.0047 + 1.4) + 0.00396 * Math.cos(z * 0.0018);
        }

        function angleAt(z) {
            return Math.atan(curveSlope(z));
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            let ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);
            let sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(10, 30, 20);
            scene.add(sun);

            let grass = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshPhongMaterial({ color: 0x3aa84c })
            );
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = -0.2;
            scene.add(grass);

            buildTrackGrid();
            buildVehicles();
        }

        function buildTrackGrid() {
            roadSegments.forEach(r => scene.remove(r));
            leftBarriers.forEach(b => scene.remove(b));
            rightBarriers.forEach(b => scene.remove(b));
            decorations.forEach(d => scene.remove(d));
            roadSegments = []; leftBarriers = []; rightBarriers = []; decorations = [];

            let roadW = 16;
            let segL = 20;
            let totalSegs = Math.ceil(gameState.trackLength / segL) + 5;

            for(let i = 0; i < totalSegs; i++) {
                let z = -i * segL;
                let x = curveAt(z);
                let ang = angleAt(z);
                let isEven = i % 2 === 0;

                let roadMat = new THREE.MeshPhongMaterial({ color: isEven ? 0x444444 : 0x555555 });
                let road = new THREE.Mesh(new THREE.PlaneGeometry(roadW, segL + 1), roadMat);
                road.rotation.x = -Math.PI / 2;
                road.rotation.z = ang;
                road.position.set(x, 0, z);
                scene.add(road);
                roadSegments.push(road);

                let centerStripe = new THREE.Mesh(
                    new THREE.BoxGeometry(0.5, 0.05, segL * 0.55),
                    new THREE.MeshBasicMaterial({ color: 0xf7f7f7 })
                );
                centerStripe.position.set(x, 0.05, z);
                centerStripe.rotation.z = ang;
                scene.add(centerStripe);
                decorations.push(centerStripe);

                let barrierMat = new THREE.MeshPhongMaterial({ color: isEven ? 0xff0000 : 0xffffff });
                let barrierGeo = new THREE.BoxGeometry(0.6, 1.2, segL);

                let lb = new THREE.Mesh(barrierGeo, barrierMat);
                lb.position.set(x - roadW / 2, 0.6, z);
                lb.rotation.y = ang;
                scene.add(lb);
                leftBarriers.push(lb);

                let rb = new THREE.Mesh(barrierGeo, barrierMat);
                rb.position.set(x + roadW / 2, 0.6, z);
                rb.rotation.y = ang;
                scene.add(rb);
                rightBarriers.push(rb);

                if(i % 3 === 0) {
                    let side = Math.random() > 0.5 ? 1 : -1;
                    let tree = new THREE.Group();
                    let trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 1.1, 8), new THREE.MeshPhongMaterial({ color: 0x8b5a2b }));
                    trunk.position.y = 0.55;
                    let leaves = new THREE.Mesh(new THREE.SphereGeometry(0.8, 10, 10), new THREE.MeshPhongMaterial({ color: 0x2f9e44 }));
                    leaves.position.y = 1.5;
                    tree.add(trunk); tree.add(leaves);
                    tree.position.set(x + side * (roadW / 2 + 3), 0, z + (Math.random() - 0.5) * 6);
                    scene.add(tree);
                    decorations.push(tree);
                }
            }

            let finishGeo = new THREE.BoxGeometry(roadW, 1, 1);
            let finishMat = new THREE.MeshPhongMaterial({ color: 0xffff00 });
            let finishSign = new THREE.Mesh(finishGeo, finishMat);
            finishSign.position.set(curveAt(-gameState.trackLength), 6, -gameState.trackLength);
            finishSign.rotation.y = angleAt(-gameState.trackLength);
            scene.add(finishSign);
            decorations.push(finishSign);
        }

        function buildVehicles() {
            if(playerVehicle) scene.remove(playerVehicle);
            if(enemyVehicle) scene.remove(enemyVehicle);

            playerVehicle = new THREE.Group();
            let body = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 2.2), new THREE.MeshPhongMaterial({ color: 0x0099ff }));
            body.position.y = 0.4;
            playerVehicle.add(body);
            let wheelGeo = new THREE.CylinderGeometry(0.3, 0.3, 0.4, 12);
            let wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });
            [-0.8, 0.8].forEach(x => {
                [-0.8, 0.8].forEach(z => {
                    let w = new THREE.Mesh(wheelGeo, wheelMat);
                    w.rotation.z = Math.PI / 2;
                    w.position.set(x, 0.3, z);
                    playerVehicle.add(w);
                });
            });
            scene.add(playerVehicle);

            enemyVehicle = new THREE.Group();
            let ebody = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.6, 2.2), new THREE.MeshPhongMaterial({ color: 0xff3333 }));
            ebody.position.y = 0.4;
            enemyVehicle.add(ebody);
            [-0.8, 0.8].forEach(x => {
                [-0.8, 0.8].forEach(z => {
                    let w = new THREE.Mesh(wheelGeo, wheelMat);
                    w.rotation.z = Math.PI / 2;
                    w.position.set(x, 0.3, z);
                    enemyVehicle.add(w);
                });
            });
            scene.add(enemyVehicle);
        }

        function createSpeedSpark(x, y, z) {
            let pGeo = new THREE.SphereGeometry(0.1, 4, 4);
            let pMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
            let p = new THREE.Mesh(pGeo, pMat);
            p.position.set(x, y, z);
            scene.add(p);
            particles.push({ mesh: p, vx: (Math.random()-0.5)*0.2, vy: Math.random()*0.2, vz: Math.random()*0.2, life: 20 });
        }

        function updateParticles() {
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.mesh.position.x += p.vx;
                p.mesh.position.y += p.vy;
                p.mesh.position.z += p.vz;
                p.life--;
                if(p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if(e.key === 'ArrowUp' || e.key === 'w') keys.gas = true;
        });
        window.addEventListener('keyup', (e) => {
            if(e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if(e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if(e.key === 'ArrowUp' || e.key === 'w') keys.gas = false;
        });

        const wireTouch = (id, keyField) => {
            let el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyField] = true; }, { passive: false });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyField] = false; }, { passive: false });
        };
        wireTouch('btn-left', 'left');
        wireTouch('btn-right', 'right');
        wireTouch('btn-gas', 'gas');

        function animate() {
            requestAnimationFrame(animate);
            if(!gameState.playing) return;

            if(keys.gas) {
                playerStats.speed = Math.min(playerStats.speed + playerStats.accel, playerStats.maxSpeed);
            } else {
                playerStats.speed = Math.max(playerStats.speed - playerStats.decel, 0);
            }

            if(keys.left) playerStats.x -= 0.15;
            if(keys.right) playerStats.x += 0.15;

            playerStats.z -= playerStats.speed;

            if(playerStats.x < -7.3) { playerStats.x = -7.3; playerStats.speed *= 0.5; AudioEngine.playCrash(); createSpeedSpark(playerStats.x, 0.5, playerStats.z); }
            if(playerStats.x > 7.3) { playerStats.x = 7.3; playerStats.speed *= 0.5; AudioEngine.playCrash(); createSpeedSpark(playerStats.x, 0.5, playerStats.z); }

            playerVehicle.position.set(curveAt(playerStats.z) + playerStats.x, 0, playerStats.z);
            playerVehicle.rotation.y = angleAt(playerStats.z);

            AudioEngine.playEngine(playerStats.speed / playerStats.maxSpeed);

            enemyStats.z -= enemyStats.speed;
            enemyStats.x += Math.sin(Date.now() / 400) * 0.05;
            if(enemyStats.x < -6) enemyStats.x = -6;
            if(enemyStats.x > 6) enemyStats.x = 6;
            enemyVehicle.position.set(curveAt(enemyStats.z) + enemyStats.x, 0, enemyStats.z);
            enemyVehicle.rotation.y = angleAt(enemyStats.z);

            const targetX = curveAt(playerStats.z) + playerStats.x;
            camera.position.x += (targetX - camera.position.x) * 0.08;
            camera.position.y += (3.5 - camera.position.y) * 0.08;
            camera.position.z += (playerStats.z + 7 - camera.position.z) * 0.08;
            camera.lookAt(new THREE.Vector3(targetX, 1, playerStats.z - 10));

            updateParticles();

            let posText = (playerStats.z < enemyStats.z) ? "1" : "2";
            document.getElementById('hud-pos').innerText = posText;

            if(playerStats.z <= -gameState.trackLength || enemyStats.z <= -gameState.trackLength) {
                endRace();
            }

            renderer.render(scene, camera);
        }

        function generateLevelMenu() {
            let container = document.getElementById('level-grid');
            container.innerHTML = "";
            for(let i = 1; i <= 40; i++) {
                let div = document.createElement('div');
                let isUnlocked = gameState.unlockedLevels.includes(i);

                div.className = `level-item ${isUnlocked ? 'unlocked' : 'locked'}`;
                if(i === gameState.currentLevel) div.className += ' current';

                div.innerHTML = `Msn ${i}`;
                if(!isUnlocked) div.innerHTML += '<span class="lock-cost">🪙 30</span>';

                div.onclick = () => {
                    if(isUnlocked) {
                        gameState.currentLevel = i;
                        startCountdown();
                    } else {
                        if(gameState.credits >= 30) {
                            if(confirm(`Möchtest du Mission ${i} für 30 Credits freischalten?`)) {
                                gameState.credits -= 30;
                                gameState.unlockedLevels.push(i);
                                saveData();
                                generateLevelMenu();
                            }
                        } else {
                            alert("Nicht genug Credits! Kaufe welche im Shop oder gewinne vorherige Level.");
                        }
                    }
                };
                container.appendChild(div);
            }
        }

        function startCountdown() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('controls').classList.remove('hidden');

            playerStats.z = 0; playerStats.x = -2; playerStats.speed = 0;
            enemyStats.z = 0; enemyStats.x = 2;
            enemyStats.speed = 1.6 + (gameState.currentLevel * 0.02);

            gameState.trackLength = 1800 + (gameState.currentLevel * 120);
            document.getElementById('hud-level').innerText = gameState.currentLevel;

            buildTrackGrid();
            AudioEngine.playBGM();

            let cdVal = 3;
            let cdEl = document.getElementById('countdown');
            cdEl.style.display = 'block';
            cdEl.innerText = cdVal;

            let timer = setInterval(() => {
                cdVal--;
                if(cdVal === 0) {
                    cdEl.innerText = 'START!';
                    gameState.playing = true;
                } else if(cdVal < 0) {
                    clearInterval(timer);
                    cdEl.style.display = 'none';
                } else {
                    cdEl.innerText = cdVal;
                }
            }, 1000);
        }

        function endRace() {
            gameState.playing = false;
            AudioEngine.stopEngine();
            AudioEngine.stopBGM();

            let win = playerStats.z < enemyStats.z;
            let resTitle = document.getElementById('result-title');
            let resDesc = document.getElementById('result-desc');
            let resBtn = document.getElementById('btn-result-action');

            if(win) {
                resTitle.innerText = '🏆 Sieg!';
                resTitle.style.color = '#00ff00';
                resDesc.innerText = `Du hast Mission ${gameState.currentLevel} erfolgreich beendet! Belohnung: +50 Credits.`;
                gameState.credits += 50;
                AudioEngine.playWin();

                if(gameState.currentLevel < 40 && !gameState.unlockedLevels.includes(gameState.currentLevel + 1)) {
                    gameState.unlockedLevels.push(gameState.currentLevel + 1);
                }
                resBtn.innerText = 'Nächstes Level';
                resBtn.onclick = () => {
                    if(gameState.currentLevel < 40) {
                        gameState.currentLevel++;
                        startCountdown();
                    } else {
                        alert('Du hast alle Missionen geschafft!');
                        showMenu();
                    }
                };
            } else {
                resTitle.innerText = '💥 Verloren!';
                resTitle.style.color = '#ff3300';
                resDesc.innerText = 'Der Gegner war schneller im Ziel! Schalte das nächste Level direkt für 30 Credits frei oder versuche es nochmal.';
                AudioEngine.playLoose();

                resBtn.innerText = 'Nochmal versuchen';
                resBtn.onclick = () => { startCountdown(); };
            }

            saveData();

            document.getElementById('hud').classList.add('hidden');
            document.getElementById('controls').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
        }

        function showMenu() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.add('hidden');
            document.getElementById('menu-screen').classList.remove('hidden');
            generateLevelMenu();
        }

        function buyCredits(amount, price) {
            alert(`In-App-Kauf simuliert: Du hast ${amount} Credits für ${price}€ gekauft!`);
            gameState.credits += amount;
            saveData();
            showMenu();
        }

        document.getElementById('btn-open-shop').onclick = () => {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('shop-screen').classList.remove('hidden');
        };
        document.getElementById('btn-close-shop').onclick = () => {
            showMenu();
        };
        document.getElementById('btn-result-menu').onclick = () => {
            showMenu();
        };

        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        window.onload = () => {
            init3D();
            generateLevelMenu();
            saveData();
            animate();
        };
    </script>
</body>
</html>
